services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spaceexplorer
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev -d spaceexplorer" ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/spaceexplorer
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data: